[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shuttlelens-api"
version = "0.1.0"
description = "ShuttleLens mini-program API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "PyJWT>=2.10,<3.0",
    "PyMySQL>=1.1,<2.0",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "cryptography>=43,<46",
    "bcrypt>=4.0,<5.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
