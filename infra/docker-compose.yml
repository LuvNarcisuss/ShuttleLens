services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: good_badminton
      MYSQL_USER: good_badminton
      MYSQL_PASSWORD: good_badminton
      MYSQL_ROOT_PASSWORD: root-password-change-me
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot-password-change-me"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
    environment:
      DATABASE_URL: mysql+pymysql://good_badminton:good_badminton@mysql:3306/good_badminton
      JWT_SECRET: change-me-before-production
      WECHAT_AUTH_MODE: mock
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
